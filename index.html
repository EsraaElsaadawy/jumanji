<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jumanji</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--mut:#6b6f85;--pri:#ff7a00;--ok:#2bb673;--bad:#ef476f;--blue:#4895ef;--line:#ffe0b3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2842;--ink:#f4f1ff;--mut:#b5b2d1;--line:#3d3a60}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2.4rem;margin:8px 0;text-align:center;color:var(--pri);letter-spacing:1px}
h2{text-align:center;margin:6px 0 14px}
.sub{text-align:center;color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.btn{border:0;border-radius:18px;padding:14px;font:inherit;font-weight:700;font-size:1.1rem;color:#fff;background:var(--pri);cursor:pointer;width:100%;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.blue{background:var(--blue)}.btn.green{background:var(--ok)}.btn.gray{background:var(--mut)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;margin:12px 0}
.v{font-size:3rem;direction:ltr;padding:22px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;text-align:center;cursor:pointer;direction:ltr}
.card:active{transform:scale(.97)}
.em{font-size:3.4rem;line-height:1.2}
.w{font-size:1.6rem;font-weight:800}
.w b{color:var(--pri)}
.ar{font-size:.9rem;color:var(--mut);direction:rtl}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.back{background:none;border:0;font:inherit;font-size:1rem;color:var(--blue);cursor:pointer;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.big{font-size:6rem;text-align:center;margin:6px 0}
.say{display:block;margin:0 auto 14px;width:90px;height:90px;border-radius:50%;border:0;background:var(--blue);font-size:2.4rem;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 4px;font:inherit;color:var(--ink);cursor:pointer}
.opt.e{font-size:3rem}.opt.t{font-size:1.5rem;font-weight:800}
.opt.good{border-color:var(--ok);background:rgba(43,182,115,.2)}
.opt.bad{border-color:var(--bad);background:rgba(239,71,111,.2);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots,.tiles{display:flex;gap:8px;justify-content:center;direction:ltr;margin:12px 0}
.slot{width:54px;height:62px;border-bottom:4px solid var(--pri);font-size:2rem;font-weight:800;text-align:center;line-height:62px}
.tile{width:58px;height:58px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-size:1.8rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tile[disabled]{opacity:.25}
.ti{display:block;width:80%;margin:10px auto;font:inherit;font-size:2rem;font-weight:800;text-align:center;direction:ltr;border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--card);color:var(--ink)}
.ti.bad{border-color:var(--bad);animation:sh .3s}
.pads{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0}
.pad{position:relative;flex:1;max-width:110px;aspect-ratio:110/130;border:3px dashed var(--line);border-radius:16px;background:var(--card)}
.pad .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:bold min(24vw,92px) "Arial Rounded MT Bold",Arial,sans-serif;color:var(--pri);opacity:.13;pointer-events:none;user-select:none}
.pad .g.p{opacity:.3}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad.wp{flex:1;max-width:100%;aspect-ratio:600/220}
.pad canvas.gd{pointer-events:none}
.aw{font-size:1.9rem;font-weight:700;line-height:1.9;direction:rtl;font-family:Tahoma,"Noto Naskh Arabic",system-ui,sans-serif}
.pad .g.ar{font-family:Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
.fb{text-align:center;font-size:1.3rem;font-weight:800;min-height:34px;margin-top:14px}
.stars{font-size:3.4rem;text-align:center}
.best{font-size:.85rem;opacity:.9}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SETS={
 a:{title:'Short a',words:[['cap','🧢','قبعة'],['tap','🚰','حنفية'],['lap','🧘','حِجر'],['fat','🐷','سمين'],['rat','🐀','فأر'],['mat','🟫','سجادة'],['can','🥫','علبة'],['fan','🌬️','مروحة'],['man','👨','رجل']]},
 e:{title:'Short e',words:[['pen','🖊️','قلم'],['hen','🐔','دجاجة'],['ten','🔟','عشرة'],['den','🦁','عرين'],['jet','✈️','طائرة'],['wet','💦','مبلل'],['pet','🐶','حيوان أليف'],['vet','👨‍⚕️','طبيب بيطري']]}
};
const ALL=[].concat(SETS.a.words,SETS.e.words);
const V=['A','E','I','O','U'];
let best={};try{best=JSON.parse(localStorage.getItem('jumanji')||'{}')}catch(e){}
function save(k,v){if((best[k]||0)<v){best[k]=v;try{localStorage.setItem('jumanji',JSON.stringify(best))}catch(e){}}}
const $=document.getElementById('app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let VO=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));VO=vs.find(v=>/samantha|google us|zira|aria|jenny|karen/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function mk(t,r,p){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;u.pitch=p||1.1;if(VO)u.voice=VO;return u}
function speak(t,r){try{seq++;const s=window.speechSynthesis;s.cancel();s.speak(mk(t,r||.8))}catch(e){}}
let seq=0;
/* Phonics: letter SOUNDS (not names). Edit the respellings here if a sound is not clear on your phone. */
const PH={a:'ah',e:'eh',i:'ih',o:'ahh',u:'uh',b:'buh',c:'kuh',d:'duh',f:'fuh',g:'guh',h:'huh',j:'juh',k:'kuh',l:'luh',m:'muh',n:'nuh',p:'puh',q:'kwuh',r:'ruh',s:'suh',t:'tuh',v:'vuh',w:'wuh',x:'ks',y:'yuh',z:'zuh'};
function spell(w){try{const s=window.speechSynthesis;s.cancel();const id=++seq;
 const RM={ap:'app',at:'at',an:'an',en:'en',et:'ett'};const parts=[[PH[w[0]]||w[0],.55,250],[RM[w.slice(1)]||w.slice(1),.55,250],[w,.4,500],[w,.8,600]];
 let i=0;const go=()=>{if(id!==seq||i>=parts.length)return;const[t,r,d]=parts[i++];
  setTimeout(()=>{if(id!==seq)return;const u=mk(t,r,1.1);u.onend=go;s.speak(u)},i===1?0:d)};go()}catch(e){}}
let G=null,cur=null;

function home(){
 cur='home';
 $.innerHTML=`<div class="top"><button class="back" onclick="showLang()">→ اللغة · Language</button><span></span></div><h1>🦁 Jumanji</h1><p class="sub">اتعلم الكلمات بالصور والصوت!</p>
 <h2>5 Vowels</h2>
 <div class="grid">${V.map((v,i)=>{const k=v.toLowerCase(),ok=SETS[k];return `<button class="btn ${ok?'':'gray'}" ${ok?`onclick="setPage('${k}')"`:'disabled'} style="background:${ok?['#ff7a00','#4895ef'][i]:''}"><div class="v">${v}</div>${ok?SETS[k].title:'قريبًا'}</button>`}).join('')}</div>
 <div class="row"><button class="btn green" onclick="start('mix','quiz')">🏆 اختبار شامل ${best.mix?'<div class="best">أفضل: '+best.mix+'⭐</div>':''}</button></div>`;
}
function setPage(k){
 cur=k;const S=SETS[k];
 $.innerHTML=`<div class="top"><button class="back" onclick="home()">→ رجوع</button><span></span></div>
 <h2>${S.title}</h2><p class="sub">اضغط على الكارت واسمع أصوات الحروف ثم الكلمة 🔤</p>
 <div class="grid">${S.words.map((w,i)=>`<div class="card" onclick="spell('${w[0]}')"><div class="em">${w[1]}</div><div class="w">${w[0][0]}<b>${w[0][1]}</b>${w[0].slice(2)}</div><div class="ar">${w[2]}</div></div>`).join('')}</div>
 <div class="row"><button class="btn" style="background:#9b5de5" onclick="start('${k}','quiz','type')">✍️ اختبار الكتابة ${best[k+'_t']?'<div class="best">أفضل: '+best[k+'_t']+'⭐</div>':''}</button></div>
 <div class="row"><button class="btn blue" onclick="start('${k}','practice')">🎯 تدريب</button><button class="btn green" onclick="start('${k}','quiz')">🏆 اختبار ${best[k]?'<div class="best">أفضل: '+best[k]+'⭐</div>':''}</button></div>`;
}
function start(k,mode,only){
 const pool=k==='mix'?ALL:SETS[k].words;
 const n=mode==='quiz'?(k==='mix'?10:Math.min(8,pool.length)):pool.length;
 let ws=sh(pool);while(ws.length<n)ws=ws.concat(sh(pool));
 const T=only?[only]:['hear','see','build','type'];
 G={k,mode,only,pool,i:0,score:0,qs:ws.slice(0,n).map((w,i)=>({w,t:T[i%T.length],miss:false}))};
 sh(G.qs);question();
}
function question(){
 const q=G.qs[G.i],w=q.w[0];G.lock=false;G.pos=[];
 const pct=G.i/G.qs.length*100;
 let body='';
 const others=sh(ALL.filter(x=>x[0]!==w)).slice(0,2);
 if(q.t==='hear'){
  q.opts=sh([q.w,...others]);
  body=`<p class="sub">اسمع وأختار الصورة الصح</p><button class="say" onclick="speak('${w}')">🔊</button>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt e" onclick="pick(${i})">${o[1]}</button>`).join('')}</div>`;
 }else if(q.t==='see'){
  q.opts=sh([q.w,...others]);
  body=`<p class="sub">إيه اسم الصورة دى؟</p><div class="big">${q.w[1]}</div><button class="say" onclick="speak('${w}')">🔊</button>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt t" onclick="pick(${i})">${o[0]}</button>`).join('')}</div>`;
 }else if(q.t==='type'){
  body=typeBody(q);
 }else{
  q.tiles=sh(w.split(''));
  body=`<p class="sub">رتّب الحروف عشان تكتب الكلمة</p><div class="big">${q.w[1]}</div><button class="say" onclick="speak('${w}')">🔊</button>
  <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
  <div class="row" style="justify-content:center"><button class="btn gray" style="width:auto" onclick="undo()">↩️ مسح</button></div>`;
 }
 $.innerHTML=`<div class="top"><button class="back" onclick="${G.k==='mix'?'home':`setPage`}(${G.k==='mix'?'':`'${G.k}'`})">→ خروج</button><b>⭐ ${G.score}</b></div>
 <div class="bar"><i style="width:${pct}%"></i></div>${body}<div class="fb" id="fb"></div>`;
 if(q.t==='build')drawBuild();
 if(q.t==='type')initPads();
 if(q.t!=='see')setTimeout(()=>speak(w),300);
}
function fb(ok,msg){const f=document.getElementById('fb');f.textContent=msg;f.style.color=ok?'var(--ok)':'var(--bad)'}
function done(ok,btn){
 const q=G.qs[G.i];
 if(ok){if(!q.miss)G.score++;fb(true,'برافو! 🎉 Good job!');cheer(q.w[0]);G.lock=true;setTimeout(next,2300);}
 else{q.miss=true;oops();
  if(G.mode==='practice'){fb(false,'حاول تانى 💪');if(btn){btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),500)}return false}
  fb(false,'الإجابة: '+q.w[0]);speak(q.w[0]);G.lock=true;setTimeout(next,1800);
 }
 return true;
}
let AC;
function ctx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function note(f,t,d,vol,type){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
function chime(){try{const t=ctx().currentTime+.02;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{note(f,t+i*.11,.5,.22,'triangle');note(f*2,t+i*.11,.35,.05,'sine')});note(1318.5,t+.5,.9,.16,'triangle');note(1568,t+.5,.9,.08,'sine')}catch(e){}}
function oops(){try{const t=ctx().currentTime+.02;note(330,t,.25,.15,'sine');note(262,t+.18,.4,.15,'sine')}catch(e){}}
function cheer(w){chime();try{seq++;const s=window.speechSynthesis;s.cancel();const P=['Good job!','Great job!','Excellent!','Well done!','Awesome!'];
 setTimeout(()=>{s.speak(mk(P[Math.floor(Math.random()*P.length)],.9,1.25));s.speak(mk(w,.8))},600)}catch(e){}}
const PW=110,PHT=130,GF='bold 100px "Arial Rounded MT Bold",Arial,sans-serif';
function typeBody(q){const w=q.w[0];
 return `<p class="sub">اسمع واكتب كل حرف بصباعك ✍️</p><div class="big" style="font-size:4.5rem">${q.w[1]}</div><button class="say" onclick="speak('${w}')">🔊</button>
 <div class="pads">${w.split('').map((c,i)=>`<div class="pad" id="pd${i}"><span class="g ${G.mode==='practice'?'p':''}">${c}</span><canvas id="cv${i}" width="${PW}" height="${PHT}"></canvas></div>`).join('')}</div>
 <div class="row" style="justify-content:center"><button class="btn gray" style="width:auto" onclick="clearPads()">🧽 مسح</button><button class="btn green" style="width:auto;padding:14px 30px" onclick="checkPads()">تحقق ✅</button></div>`}
function initPads(){document.querySelectorAll('.pad canvas:not(.gd)').forEach(cv=>{const x=cv.getContext('2d');x.lineWidth=+cv.dataset.lw||9;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#4895ef';x.fillStyle='#4895ef';let d=false,lx=0,ly=0;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{if(G.lock||cv.dataset.ok)return;d=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}[lx,ly]=pt(e);x.beginPath();x.arc(lx,ly,4.5,0,7);x.fill();e.preventDefault()};
 cv.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;e.preventDefault()};
 cv.onpointerup=cv.onpointercancel=()=>{d=false}})}
function clearPads(){if(G.lock)return;document.querySelectorAll('.pad canvas:not(.gd)').forEach(cv=>{if(!cv.dataset.ok)cv.getContext('2d').clearRect(0,0,cv.width,cv.height)})}
function grid(data,w,h){let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return null;const N=16,g=new Uint8Array(N*N),bw=x1-x0+1,bh=y1-y0+1;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(data[(y*w+x)*4+3]>40)g[Math.min(N-1,Math.floor((y-y0)*N/bh))*N+Math.min(N-1,Math.floor((x-x0)*N/bw))]=1;
 return{g,sz:Math.max(bw,bh)}}
function dil(g){const N=16,o=new Uint8Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y*N+x])for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<N&&b<N)o[b*N+a]=1}return o}
function okLetter(cv,ch){const w=cv.width,h=cv.height,ink=grid(cv.getContext('2d').getImageData(0,0,w,h).data,w,h);
 if(!ink||ink.sz<35)return false;
 const t=document.createElement('canvas');t.width=w;t.height=h;const c=t.getContext('2d');c.font=cv.dataset.font||GF;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.fillText(ch,w/2,h/2);
 const tp=grid(c.getImageData(0,0,w,h).data,w,h);if(!tp)return true;
 const D=dil(tp.g),I=dil(ink.g);let tc=0,th=0,ic=0,ih=0;
 for(let i=0;i<256;i++){if(tp.g[i]){tc++;if(I[i])th++}if(ink.g[i]){ic++;if(D[i])ih++}}
 return th/tc>=.6&&ih/ic>=.6}
function checkPads(){if(G.lock)return;const q=G.qs[G.i],w=q.w[0],cvs=[...document.querySelectorAll('.pad canvas:not(.gd)')];let all=true;
 cvs.forEach((cv,i)=>{const p=document.getElementById('pd'+i);if(cv.dataset.ok)return;
  if(okLetter(cv,w[i])){cv.dataset.ok=1;p.style.borderColor='var(--ok)';p.style.borderStyle='solid'}else{all=false;p.style.borderColor='var(--bad)'}});
 const fin=done(all);
 if(!all&&!fin)cvs.forEach((cv,i)=>{if(!cv.dataset.ok)setTimeout(()=>{cv.getContext('2d').clearRect(0,0,cv.width,cv.height);document.getElementById('pd'+i).style.borderColor=''},800)});
 if(!all&&fin)document.querySelectorAll('.g').forEach(g=>{g.style.opacity=1})}
function pick(i){
 if(G.lock)return;const q=G.qs[G.i],btn=document.querySelectorAll('.opt')[i];
 const ok=q.opts[i][0]===q.w[0];
 if(ok)btn.classList.add('good');
 done(ok,btn);
}
function drawBuild(){
 const q=G.qs[G.i],w=q.w[0];
 document.getElementById('slots').innerHTML=w.split('').map((_,i)=>`<div class="slot">${G.pos[i]!==undefined?q.tiles[G.pos[i]]:''}</div>`).join('');
 document.getElementById('tiles').innerHTML=q.tiles.map((c,i)=>`<button class="tile" ${G.pos.includes(i)?'disabled':''} onclick="tile(${i})">${c}</button>`).join('');
}
function tile(i){
 if(G.lock)return;const q=G.qs[G.i],w=q.w[0];
 G.pos.push(i);drawBuild();
 if(G.pos.length===w.length){
  const s=G.pos.map(p=>q.tiles[p]).join('');
  const fin=done(s===w);
  if(!fin)setTimeout(()=>{G.pos=[];drawBuild()},700);
 }
}
function undo(){if(G.lock)return;G.pos.pop();drawBuild()}
function next(){
 G.i++;
 if(G.i<G.qs.length)return question();
 const n=G.qs.length,p=G.score/n,st=p>=.9?3:p>=.6?2:p>=.3?1:0;
 if(G.mode==='quiz')save(G.k+(G.only?'_t':''),st);
 $.innerHTML=`<h1>${G.mode==='quiz'?'🏆 النتيجة':'🎉 خلصت التدريب'}</h1>
 <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
 <h2>${G.score} / ${n}</h2><p class="sub">${st===3?'ممتاز يا بطل! 🦁':st>=1?'كويس جدًا، كمّل! 💪':'حاول تانى وهتبقى أحسن 😊'}</p>
 <div class="row"><button class="btn" onclick="start('${G.k}','${G.mode}','${G.only||''}')">🔁 مرة تانية</button><button class="btn blue" onclick="home()">🏠 الرئيسية</button></div>`;
}
/* ===== Arabic section ===== */
const F='\u064E',D='\u064F',K='\u0650',MK=[F,D,K],LG={[F]:'ا',[D]:'و',[K]:'ي'},TN=['\u064B','\u064C','\u064D'];
const AR=[
['أ','الألف',[['أَسَدٌ','🦁'],['إِبْرَةٌ','🪡'],['أُذُنٌ','👂']]],
['ب','الباء',[['بَقَرَةٌ','🐄'],['بِنْتٌ','👧'],['بُرْجٌ','🗼']]],
['م','الميم',[['مَوْزٌ','🍌'],['مِلْحٌ','🧂'],['مُثَلَّثٌ','🔺']]],
['ح','الحاء',[['حَبْلٌ','🪢'],['حِصَانٌ','🐴'],['حُوتٌ','🐋']]],
['ج','الجيم',[['جَبَلٌ','⛰️'],['جَمَلٌ','🐪'],['جُبْنٌ','🧀']]],
['د','الدال',[['دَجَاجٌ','🐔'],['دِيكٌ','🐓'],['دُبٌّ','🐻']]],
['خ','الخاء',[['خَرُوفٌ','🐑'],['خِيَارٌ','🥒'],['خُبْزٌ','🍞']]],
['ت','التاء',[['تَاجٌ','👑'],['تِينٌ','🟣'],['تُوتٌ','🫐']]],
['ل','اللام',[['لَبَنٌ','🥛'],['لِسَانٌ','👅'],['لُعْبَةٌ','🧸']]],
['س','السين',[['سَاعَةٌ','⏰'],['سِتَارَةٌ','🪟'],['سُلَّمٌ','🪜']]],
['ن','النون',[['نَحْلٌ','🐝'],['نَسْرٌ','🦅'],['نُجُومٌ','⭐']]],
['ر','الراء',[['رَأْسٌ','🙂'],['رِيشَةٌ','🪶'],['رُمَّانٌ','🔴']]],
['ف','الفاء',[['فَأْرٌ','🐭'],['فِيلٌ','🐘'],['فُولٌ','🫘']]],
['ك','الكاف',[['كَلْبٌ','🐶'],['كِتَابٌ','📖'],['كُرَةٌ','⚽']]],

['ع','العين',[['عِنَبٌ','🍇'],['عَلَمٌ','🚩'],['عُشٌّ','🪺']]]];
const AW=[];AR.forEach((x,li)=>x[2].forEach(w=>AW.push({w:w[0],e:w[1],li})));
const rnd=n=>Math.floor(Math.random()*n);
const clus=s=>{const r=[];for(const c of s){if(/[\u064B-\u0652]/.test(c)&&r.length)r[r.length-1]+=c;else r.push(c)}return r};
let AVO=null,AA=null;
function pickAr(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test((v.lang||'').replace('_','-')));AVO=vs.find(v=>/ar-EG/i.test(v.lang.replace('_','-')))||vs.find(v=>/ar-SA/i.test(v.lang.replace('_','-')))||vs[0]||null}catch(e){}}
try{const _pv=speechSynthesis.onvoiceschanged;speechSynthesis.onvoiceschanged=()=>{try{pickVoice()}catch(e){}pickAr()};pickAr();setTimeout(pickAr,500);setTimeout(pickAr,1500)}catch(e){}
function aStop(){try{speechSynthesis.cancel()}catch(e){}try{if(AA){AA.pause();AA=null}}catch(e){}}
/* Arabic: use an installed Arabic voice if there is one; otherwise fall back to online TTS audio */
function asay(t,r,p){return new Promise(res=>{
 let done=false;const fin=()=>{if(!done){done=true;res()}};setTimeout(fin,9000);
 const online=()=>{try{const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q='+encodeURIComponent(t));a.playbackRate=(r||.7)<.8?.9:1;a.onended=fin;a.onerror=fin;AA=a;const pr=a.play();if(pr&&pr.catch)pr.catch(fin)}catch(e){fin()}};
 pickAr();
 if(!AVO){online();return}
 try{const u=new SpeechSynthesisUtterance(t);u.voice=AVO;u.lang=AVO.lang;u.rate=r||.7;u.pitch=p||1.1;
  let started=false;u.onstart=()=>{started=true};u.onend=fin;u.onerror=()=>{if(!started&&!done){online()}else fin()};
  setTimeout(()=>{if(!started&&!done){try{speechSynthesis.cancel()}catch(e){}online()}},1500);
  speechSynthesis.speak(u)}catch(e){online()}})}
function aspeak(t,r){seq++;aStop();setTimeout(()=>asay(t,r||.7),80)}
function arCheer(t){chime();seq++;const id=seq;aStop();const P=['ممتاز!','أحسنت!','برافو عليك!','شاطر!'];setTimeout(async()=>{if(id!==seq)return;await asay(P[rnd(4)],.9,1.2);if(id!==seq)return;await asay(t,.7)},600)}
/* ===== Whole-word writing with tashkeel (trace over the guide) ===== */
const WW=600,WH=220,WS=4;
function wordFont(ch){const c=document.createElement('canvas').getContext('2d');let z=150,f;
 for(;z>50;z-=4){f=`bold ${z}px Tahoma,"Noto Naskh Arabic",Arial,sans-serif`;c.font=f;if(c.measureText(ch).width<=WW-70)break}return f}
function paintWord(c,ch,font,strip){c.font=font;c.direction='rtl';c.textAlign='center';c.textBaseline='middle';c.fillText(strip?ch.replace(/[\u064B-\u0652]/g,''):ch,WW/2,WH/2+8)}
function drawGuide(q,a){const g=document.querySelector('canvas.gd');if(!g)return;const c=g.getContext('2d');c.clearRect(0,0,WW,WH);c.globalAlpha=a;c.fillStyle='#ff7a00';paintWord(c,q.w[0],q.font,false);c.globalAlpha=1}
const GW=Math.ceil(WW/WS),GH=Math.ceil(WH/WS);
function cells(ctx){const d=ctx.getImageData(0,0,WW,WH).data,g=new Uint8Array(GW*GH);
 for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)if(d[(y*WW+x)*4+3]>40)g[((y/WS)|0)*GW+((x/WS)|0)]=1;return g}
function dilW(g,r){const o=new Uint8Array(GW*GH);
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(g[y*GW+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<GW&&b<GH)o[b*GW+a]=1}return o}
function okWord(cv,ch,font){
 const ink=cells(cv.getContext('2d'));let ic=0;for(let i=0;i<ink.length;i++)ic+=ink[i];if(ic<20)return false;
 const mk=strip=>{const t=document.createElement('canvas');t.width=WW;t.height=WH;const c=t.getContext('2d');c.fillStyle='#000';paintWord(c,ch,font,strip);return cells(c)};
 const full=mk(false),base=mk(true);
 const I=dilW(ink,2),Dw=dilW(full,3),Bd=dilW(base,1);
 let fc=0,fh=0,ih=0;
 for(let i=0;i<full.length;i++){if(full[i]){fc++;if(I[i])fh++}if(ink[i]&&Dw[i])ih++}
 if(!fc||fh/fc<.6||ih/ic<.7)return false;
 /* every diacritic mark (fatha, damma, kasra, shadda, tanween...) must be traced too */
 const dia=new Uint8Array(full.length);for(let i=0;i<full.length;i++)if(full[i]&&!Bd[i])dia[i]=1;
 const seen=new Uint8Array(full.length);
 for(let s0=0;s0<dia.length;s0++){if(!dia[s0]||seen[s0])continue;
  const st=[s0];seen[s0]=1;let n=0,h=0;
  while(st.length){const i=st.pop();n++;if(I[i])h++;const x=i%GW,y=(i/GW)|0;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=x+dx,b=y+dy;if(a<0||b<0||a>=GW||b>=GH)continue;const j=b*GW+a;if(dia[j]&&!seen[j]){seen[j]=1;st.push(j)}}}
  if(n>=4&&h/n<.45)return false}
 return true}
let A=null;
function showLang(){$.innerHTML=`<h1>🦁 Jumanji</h1><p class="sub">اختار اللغة · Choose language</p>
<div class="row" style="flex-direction:column;gap:16px;margin-top:30px"><button class="btn" style="font-size:1.8rem;padding:24px" onclick="arHome()">🌙 العربية</button><button class="btn blue" style="font-size:1.8rem;padding:24px;direction:ltr" onclick="home()">🔤 English</button></div>`}
function arHome(){$.innerHTML=`<div class="top"><button class="back" onclick="showLang()">→ اللغة</button><span></span></div><h1>الحروف العربية</h1><p class="sub">اختار حرف وتعلّم الكلمات والتشكيل</p>
<div class="row"><button class="btn blue" onclick="arTash()">🔊 الأصوات القصيرة والطويلة</button></div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(78px,1fr))">${AR.map((x,i)=>`<button class="btn" style="font-size:2.4rem;padding:8px" onclick="arLetter(${i})">${x[0]}</button>`).join('')}</div>
<div class="row"><button class="btn green" onclick="arStart('all','quiz')">🏆 اختبار شامل ${best.ar_all?`<div class="best">أفضل: ${best.ar_all}⭐</div>`:''}</button></div>`}
const bt=x=>`<button class="opt t" style="font-size:2rem" onclick="aspeak('${x}')">${x}</button>`;
const arow=(t,a)=>`<p class="sub">${t}</p><div class="opts">${a.map(bt).join('')}</div>`;
function arLetter(i){const[l,nm,ws]=AR[i];
$.innerHTML=`<div class="top"><button class="back" onclick="arHome()">→ رجوع</button><span></span></div><h2>حرف ${nm}</h2><div class="big">${l}</div>
${arow('الحركات القصيرة: فتحة · ضمة · كسرة',MK.map(m=>l+m))}${arow('الحركات الطويلة (بنمدّها)',MK.map(m=>l+m+LG[m]))}${arow('التنوين',TN.map(m=>l+m))}
<h2 style="margin-top:18px">الكلمات</h2><div class="grid">${ws.map(w=>`<div class="card" onclick="aspeak('${w[0]}')"><div class="em">${w[1]}</div><div class="aw">${w[0]}</div></div>`).join('')}</div>
<div class="row"><button class="btn" style="background:#9b5de5" onclick="arStart(${i},'write')">✍️ كتابة الكلمات</button><button class="btn" style="background:#b983f0" onclick="arStart(${i},'writeL')">✍️ كتابة الحرف</button></div>
<div class="row"><button class="btn blue" onclick="arStart(${i},'practice')">🎯 تدريب</button><button class="btn green" onclick="arStart(${i},'quiz')">🏆 اختبار ${best['ar_'+i]?`<div class="best">أفضل: ${best['ar_'+i]}⭐</div>`:''}</button></div>`}
function arTash(){const l='ب';
$.innerHTML=`<div class="top"><button class="back" onclick="arHome()">→ رجوع</button><span></span></div><h2>الأصوات القصيرة والطويلة</h2>
${arow('قصيرة: فتحة · ضمة · كسرة',MK.map(m=>l+m))}${arow('طويلة: ألف مد · واو مد · ياء مد',MK.map(m=>l+m+LG[m]))}${arow('التنوين: فتحتان · ضمتان · كسرتان',TN.map(m=>l+m))}
<p class="sub" style="margin-top:14px">الصوت القصير بنقوله بسرعة، والطويل بنمدّه.</p>
<div class="row"><button class="btn blue" onclick="arStart('tash','practice')">🎯 تدريب</button><button class="btn green" onclick="arStart('tash','quiz')">🏆 اختبار ${best.ar_tash?`<div class="best">أفضل: ${best.ar_tash}⭐</div>`:''}</button></div>`}
function aq(t,li,j){const L=AR[li],q={t,li,ch:L[0]};if(j===undefined)j=rnd(L[2].length);const w=L[2][j];q.w=w;
 const oth=sh(AW.filter(x=>x.w!==w[0])).slice(0,2),m=MK[rnd(3)];
 if(t==='hear'){q.say=w[0];q.opts=sh([{t:w[1],c:'e',ok:1},...oth.map(o=>({t:o.e,c:'e'}))])}
 else if(t==='see'){q.say=w[0];q.big=w[1];q.opts=sh([{t:w[0],c:'t',ok:1},...oth.map(o=>({t:o.w,c:'t'}))])}
 else if(t==='build'){q.say=w[0];q.big=w[1];q.units=clus(w[0]);q.tiles=sh(q.units)}
 else if(t==='wl'){q.say=L[0]+F}
 else if(t==='ww'){q.say=w[0];q.big=w[1]}
 else if(t==='har'){q.say=L[0]+m;q.big='؟';q.opts=sh(MK.map(x=>({t:L[0]+x,c:'t',ok:x===m?1:0})))}
 else{const lg=rnd(2),syl=L[0]+m+(lg?LG[m]:'');q.say=syl;q.big=syl;q.opts=[{t:'قصير ⚡',c:'t',ok:lg?0:1},{t:'طويل 〰️',c:'t',ok:lg?1:0}]}
 return q}
function arStart(k,mode){let qs=[];
 if(typeof k==='number'){if(mode==='write')qs=AR[k][2].map((_,j)=>aq('ww',k,j));
  else if(mode==='writeL')qs=[0,1,2].map(()=>aq('wl',k));
  else{AR[k][2].forEach((w,j)=>{qs.push(aq(j%2?'see':'hear',k,j),aq('build',k,j))});qs.push(aq('ww',k),aq('har',k),aq('len',k))}}
 else if(k==='tash'){for(let n=0;n<10;n++)qs.push(aq(n%2?'len':'har',rnd(AR.length)))}
 else{for(let n=0;n<12;n++)qs.push(aq(['hear','see','build','ww','har','len'][n%6],rnd(AR.length)))}
 A={k,mode,i:0,score:0,qs:sh(qs),lock:false,pos:[]};G=A;arQ()}
function arBack(){typeof A.k==='number'?arLetter(A.k):A.k==='tash'?arTash():arHome()}
function arQ(){const q=A.qs[A.i];A.lock=false;A.pos=[];
 const T={hear:'اسمع واختار الصورة الصح',see:'إيه اسم الصورة دى؟',har:'اسمع واختار الحرف بالحركة الصح',len:'الصوت قصير ولا طويل؟',build:'رتّب الحروف بالتشكيل عشان تكتب الكلمة',wl:'اسمع واكتب الحرف بصباعك ✍️',ww:'اسمع واكتب الكلمة كلها بالتشكيل بصباعك ✍️ (امشي على الخط)'}[q.t];
 let b=`<p class="sub">${T}</p>`;
 if(q.big)b+=`<div class="big" style="${q.t==='len'||q.t==='har'||q.t==='ww'?'font-size:4.5rem':''}">${q.big}</div>`;
 if(q.say)b+=`<button class="say" onclick="aspeak('${q.say}')">🔊</button>`;
 if(q.opts){const c=q.t==='len'?2:q.t==='see'?1:3;b+=`<div class="opts" style="grid-template-columns:repeat(${c},1fr)">${q.opts.map((o,i)=>`<button class="opt ${o.c}" onclick="aPick(${i})">${o.t}</button>`).join('')}</div>`}
 else if(q.t==='build')b+=`<div class="slots" id="slots" style="direction:rtl"></div><div class="tiles" id="tiles" style="direction:rtl;flex-wrap:wrap"></div><div class="row" style="justify-content:center"><button class="btn gray" style="width:auto" onclick="aUndo()">↩️ مسح</button></div>`;
 else if(q.t==='ww')b+=`<div class="pads"><div class="pad wp" id="pd0"><canvas class="gd" width="${WW}" height="${WH}"></canvas><canvas width="${WW}" height="${WH}" data-lw="7"></canvas></div></div><div class="row" style="justify-content:center"><button class="btn gray" style="width:auto" onclick="clearPads()">🧽 مسح</button><button class="btn green" style="width:auto;padding:14px 30px" onclick="arCheckPad()">تحقق ✅</button></div>`;
 else b+=`<div class="pads"><div class="pad" id="pd0" style="max-width:170px"><span class="g ar ${A.mode!=='quiz'?'p':''}">${q.ch}</span><canvas width="110" height="130" data-font='bold 100px Tahoma,"Noto Naskh Arabic",Arial,sans-serif'></canvas></div></div><div class="row" style="justify-content:center"><button class="btn gray" style="width:auto" onclick="clearPads()">🧽 مسح</button><button class="btn green" style="width:auto;padding:14px 30px" onclick="arCheckPad()">تحقق ✅</button></div>`;
 $.innerHTML=`<div class="top"><button class="back" onclick="arBack()">→ خروج</button><b>⭐ ${A.score}</b></div><div class="bar"><i style="width:${A.i/A.qs.length*100}%"></i></div>${b}<div class="fb" id="fb"></div>`;
 if(q.t==='build')arDraw();if(q.t==='ww'){q.font=wordFont(q.w[0]);drawGuide(q,A.mode==='quiz'?.22:.38)}if(q.t==='wl'||q.t==='ww')initPads();
 if(q.say&&q.t!=='see')setTimeout(()=>aspeak(q.say),300)}
function aDone(ok,btn){const q=A.qs[A.i],f=document.getElementById('fb');
 if(ok){if(!q.miss)A.score++;f.textContent='برافو! 🎉';f.style.color='var(--ok)';arCheer(q.say);A.lock=true;setTimeout(arNext,2300);return true}
 q.miss=true;oops();f.style.color='var(--bad)';
 if(A.mode!=='quiz'){f.textContent='حاول تانى 💪';if(btn){btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),500)}return false}
 f.innerHTML='الإجابة: '+(q.opts?q.opts.find(o=>o.ok).t:q.t==='build'||q.t==='ww'?q.w[0]:q.ch);aspeak(q.say);A.lock=true;setTimeout(arNext,2200);return true}
function aPick(i){if(A.lock)return;const q=A.qs[A.i],b=document.querySelectorAll('.opt')[i],ok=!!q.opts[i].ok;if(ok)b.classList.add('good');aDone(ok,b)}
function arDraw(){const q=A.qs[A.i];
 document.getElementById('slots').innerHTML=q.units.map((_,i)=>`<div class="slot" style="line-height:1.9;height:74px;width:auto;min-width:44px;padding:0 4px">${A.pos[i]!==undefined?q.tiles[A.pos[i]]:''}</div>`).join('');
 document.getElementById('tiles').innerHTML=q.tiles.map((c,i)=>`<button class="tile" style="width:auto;min-width:56px;height:66px;padding:0 8px;line-height:1.7" ${A.pos.includes(i)?'disabled':''} onclick="aTile(${i})">${c}</button>`).join('')}
function aTile(i){if(A.lock)return;const q=A.qs[A.i];A.pos.push(i);arDraw();
 if(A.pos.length===q.units.length){const ok=A.pos.map(p=>q.tiles[p]).join('')===q.w[0];if(!aDone(ok))setTimeout(()=>{A.pos=[];arDraw()},700)}}
function aUndo(){if(A.lock)return;A.pos.pop();arDraw()}
function arCheckPad(){if(A.lock)return;const q=A.qs[A.i],cv=document.querySelector('.pad canvas:not(.gd)'),p=document.getElementById('pd0'),ok=q.t==='ww'?okWord(cv,q.w[0],q.font):okLetter(cv,q.ch);
 if(ok){cv.dataset.ok=1;p.style.borderColor='var(--ok)';p.style.borderStyle='solid'}else p.style.borderColor='var(--bad)';
 const fin=aDone(ok);
 if(!ok&&!fin)setTimeout(()=>{cv.getContext('2d').clearRect(0,0,cv.width,cv.height);p.style.borderColor=''},800);
 if(!ok&&fin){if(q.t==='ww')drawGuide(q,.9);else document.querySelector('.g').style.opacity=1}}
function arNext(){A.i++;if(A.i<A.qs.length)return arQ();
 const n=A.qs.length,p=A.score/n,st=p>=.9?3:p>=.6?2:p>=.3?1:0;if(A.mode==='quiz')save('ar_'+A.k,st);
 const kk=typeof A.k==='number'?A.k:`'${A.k}'`;
 $.innerHTML=`<h1>${A.mode==='quiz'?'🏆 النتيجة':'🎉 برافو'}</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${A.score} / ${n}</h2><p class="sub">${st===3?'ممتاز يا بطل! 🦁':st>=1?'كويس جدًا، كمّل! 💪':'حاول تانى وهتبقى أحسن 😊'}</p>
 <div class="row"><button class="btn" onclick="arStart(${kk},'${A.mode}')">🔁 مرة تانية</button><button class="btn blue" onclick="arBack()">🏠 رجوع</button></div>`}
showLang();
